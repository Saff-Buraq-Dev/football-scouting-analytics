[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "football-platform"
version = "0.1.0"
description = "Provider-agnostic football analytics and scouting platform"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"football_platform.database" = ["migrations/*.sql"]
"football_platform.providers.statsbomb" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: needs a running PostgreSQL (DATABASE_URL); skipped otherwise"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
